# FinanceBench retrieval-space sensitivity.
#
# With 211 passages, top_k=50 covers 23.7% of the FinanceBench corpus in one
# retrieval, against 1.4% on 2WikiMultiHopQA and 0.1% on HotpotQA. This sweep
# shrinks what the initial retrieval covers, to test whether the agentic
# configuration gains on the fixed loop when the first retrieval finds less.
#
# top_k and max_passages move together:
#   - max_passages caps the final context, so any top_k above it gives the
#     accumulating pipelines an identical condition.
#   - Naive RAG does not apply that cap unless
#     RETRIEVAL_MAX_PASSAGES_ALL_PIPELINES is set, so raising top_k alone would
#     change only its condition.
# At (30, 30) every configuration sees 30 passages.
#
# Tools match configs/experiment/rq1.yaml: search, decompose, evaluate,
# calculate. The (50, 30) point is the uncontrolled grid's condition.
# CRAG-style is left out (about 45 LLM calls per question).
#
# Usage:
#   RESULTS_DIR=data/results-topk uv run python experiments/run.py \
#     --config configs/experiment/topk_sensitivity.yaml --dataset financebench
#
#   # smoke run on 20 questions first
#   RESULTS_DIR=data/results-topk uv run python experiments/run.py \
#     --config configs/experiment/topk_sensitivity.yaml --dataset financebench \
#     --sample 20 --variants "Naive k50" "Loop k50" "Agentic k50" \
#                            "Naive k30" "Loop k30" "Agentic k30"

name: "FinanceBench retrieval-space sensitivity"
description: >
  Vary how much of the FinanceBench corpus the initial retrieval covers, to test
  whether the agentic instance's loss there is explained by retrieval space
  saturation, and to compare the pipelines once they all see the same amount.

variants:
  # --- (5, 5): 2.4% of the corpus -------------------------------------------
  - name: Naive k5
    pipeline: naive
    retrieval: { top_k: 5, max_passages: 5 }

  - name: Loop k5
    pipeline: loop
    experiment: { enable_agent_routing: false }
    retrieval: { top_k: 5, max_passages: 5 }

  - name: Agentic k5
    pipeline: agentic
    experiment: { enable_agentic_refinement: true, enable_agent_routing: false }
    retrieval: { top_k: 5, max_passages: 5 }
    agent:
      enabled_tools: [search, decompose, evaluate, calculate]

  # --- (10, 10): 4.7% ------------------------------------------------------
  - name: Naive k10
    pipeline: naive
    retrieval: { top_k: 10, max_passages: 10 }

  - name: Loop k10
    pipeline: loop
    experiment: { enable_agent_routing: false }
    retrieval: { top_k: 10, max_passages: 10 }

  - name: Agentic k10
    pipeline: agentic
    experiment: { enable_agentic_refinement: true, enable_agent_routing: false }
    retrieval: { top_k: 10, max_passages: 10 }
    agent:
      enabled_tools: [search, decompose, evaluate, calculate]

  # --- (20, 20): 9.5% ------------------------------------------------------
  - name: Naive k20
    pipeline: naive
    retrieval: { top_k: 20, max_passages: 20 }

  - name: Loop k20
    pipeline: loop
    experiment: { enable_agent_routing: false }
    retrieval: { top_k: 20, max_passages: 20 }

  - name: Agentic k20
    pipeline: agentic
    experiment: { enable_agentic_refinement: true, enable_agent_routing: false }
    retrieval: { top_k: 20, max_passages: 20 }
    agent:
      enabled_tools: [search, decompose, evaluate, calculate]

  # --- (30, 30): 14.2%, and the controlled comparison ----------------------
  - name: Naive k30
    pipeline: naive
    retrieval: { top_k: 30, max_passages: 30 }

  - name: Loop k30
    pipeline: loop
    experiment: { enable_agent_routing: false }
    retrieval: { top_k: 30, max_passages: 30 }

  - name: Agentic k30
    pipeline: agentic
    experiment: { enable_agentic_refinement: true, enable_agent_routing: false }
    retrieval: { top_k: 30, max_passages: 30 }
    agent:
      enabled_tools: [search, decompose, evaluate, calculate]

  # --- (50, 30): the uncontrolled grid's condition ------------------------
  # Naive takes 50 here and the others 30.
  - name: Naive k50
    pipeline: naive
    retrieval: { top_k: 50, max_passages: 30 }

  - name: Loop k50
    pipeline: loop
    experiment: { enable_agent_routing: false }
    retrieval: { top_k: 50, max_passages: 30 }

  - name: Agentic k50
    pipeline: agentic
    experiment: { enable_agentic_refinement: true, enable_agent_routing: false }
    retrieval: { top_k: 50, max_passages: 30 }
    agent:
      enabled_tools: [search, decompose, evaluate, calculate]
